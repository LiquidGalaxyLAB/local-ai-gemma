org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.caching=false
android.useAndroidX=true
# Disable Kotlin incremental compilation — avoids the classpath-snapshot
# transform that breaks under box64 (HashMap$Node -> BasicClassInfo cast).
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process
# Use a box64-wrapped aapt2 (x86-64 host binary) instead of Gradle's Maven one,
# which cannot run natively on ARM64 and cannot be modified inside the
# immutable transform cache.
android.aapt2FromMavenOverride=/home/nara/lgbuild/tools/aapt2
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
